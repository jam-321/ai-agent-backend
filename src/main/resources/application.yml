server:
  port: 8080

spring:
  application:
    name: ai-agent-backend
  ai:
    openai:
      # OpenAI 兼容协议：DeepSeek（国内可直连），可换成通义/OpenAI 等
      base-url: https://api.deepseek.com
      api-key: ${AI_API_KEY:sk-dummy-not-configured}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

logging:
  level:
    com.jam.agent: info
